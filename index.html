<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!--
      GTM (GA4) — injetado aqui pelo vite.config.ts a partir de
      src/app/analytics/config.ts. Vira comentário vazio enquanto o ID
      for o placeholder: zero script, zero request, zero ruído.
    -->
    %GTM_HEAD%
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dr. Hugo Doria | Neurocirurgia vascular e craniana em São Paulo</title>
    <meta
      name="description"
      content="Neurocirurgia vascular e craniana em São Paulo. Avaliação e tratamento de aneurismas, MAVs, cavernomas, doença de Moyamoya e tumores cranianos complexos."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Dr. Hugo Doria" />
    <meta name="theme-color" content="#1a293f" />

    <!-- Ícones -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Instalável na tela inicial ("baixar como se fosse aplicativo").
         iPhone: o Safari precisa só do manifest + apple-touch-icon acima, mais
         o apple-mobile-web-app-* daqui. Android: o Chrome também exige um
         service worker, registrado em main.tsx — ver public/sw.js, que é
         propositalmente vazio para não brigar com o prerender. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dr. Hugo Doria" />

    <!-- Fontes (Geist + Arimo) são SELF-HOSTED via @font-face em
         styles/fonts.css. Sem Google Fonts no critical path — nada de
         render-block nem DNS externo. -->

    <!-- LCP da home: o retrato do hero é renderizado pelo React (o scanner de
         preload não o enxerga no HTML). Este preload o descobre cedo, em
         paralelo com o JS, e derruba o LCP. Responsivo = baixa só o tamanho
         certo. (Na home é o LCP; nas subpáginas é um custo pequeno de ~30KB.) -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/hero/hero-doria-750.webp"
      imagesrcset="/hero/hero-doria-500.webp 500w, /hero/hero-doria-750.webp 750w, /hero/hero-doria-1000.webp 1000w"
      imagesizes="(max-width: 640px) 360px, (max-width: 1024px) 480px, 640px"
      fetchpriority="high"
    />

    <!-- Compartilhamento (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:site_name" content="Dr. Hugo Doria" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta
      property="og:title"
      content="Dr. Hugo Doria | Neurocirurgia vascular e craniana em São Paulo"
    />
    <meta
      property="og:description"
      content="Neurocirurgia vascular e craniana em São Paulo. Avaliação de aneurismas, MAVs, cavernomas, Moyamoya e tumores cranianos complexos."
    />
    <meta
      property="og:image"
      content="%SITE_URL%/og/og-default.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dr. Hugo Doria, neurocirurgião" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Dr. Hugo Doria | Neurocirurgia vascular e craniana em São Paulo"
    />
    <meta
      name="twitter:description"
      content="Neurocirurgia vascular e craniana em São Paulo. Avaliação de aneurismas, MAVs, cavernomas, Moyamoya e tumores cranianos complexos."
    />
    <meta
      name="twitter:image"
      content="%SITE_URL%/og/og-default.jpg"
    />

    <!--
      Dados estruturados no HTML estático: crawlers que não executam JS
      (WhatsApp, LinkedIn, bots de preview) leem daqui. As rotas internas
      reescrevem título/OG/JSON-LD em runtime via src/app/seo/useSeo.ts.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Physician",
        "@id": "%SITE_URL%/#physician",
        "name": "Dr. Hugo Doria",
        "alternateName": "Hugo Leonardo Doria Netto",
        "url": "%SITE_URL%",
        "image": "%SITE_URL%/og/og-default.jpg",
        "medicalSpecialty": "Neurologic",
        "description": "Neurocirurgião MD PhD — atuação em neurocirurgia vascular e craniana.",
        "telephone": "+55 (11) 97162-2777",
        "email": "contato@hugodoria.com.br",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rua Teixeira da Silva, 54 — conjunto 73",
          "addressLocality": "São Paulo",
          "addressRegion": "SP",
          "postalCode": "04002-030",
          "addressCountry": "BR"
        },
        "areaServed": { "@type": "City", "name": "São Paulo" },
        "sameAs": [
          "https://www.instagram.com/drhugodoria/",
          "https://www.facebook.com/hugoleonardo.dorianetto/",
          "https://www.linkedin.com/in/hugo-doria-107b834b/"
        ]
      }
    </script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #1a293f;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <!-- Fallback do GTM sem JS — mesmo marcador, mesma regra de no-op. -->
    %GTM_BODY%
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
