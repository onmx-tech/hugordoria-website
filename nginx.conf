# Regras de produção do hugodoria.com.br na VPS.
#
# Espelha o vercel.json, que segue valendo para o preview na Vercel. Os dois
# precisam contar a mesma história: redirect que existe só de um lado vira link
# quebrado quando o tráfego troca de lado. Mexeu num, mexa no outro.

# www → apex. O canonical do site (site.config.json) é https://hugodoria.com.br,
# sem www; servir os dois endereços sem escolher um divide o ranqueamento.
server {
    listen 80;
    server_name www.hugodoria.com.br;
    return 301 https://hugodoria.com.br$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O TLS e o redirect http→https são do Traefik (Easypanel), na frente daqui.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml font/woff2;

    # ── Restos do WordPress comprometido ────────────────────────────────────
    # O WP que atendia este domínio foi invadido (Japanese Keyword Hack): ~70
    # sitemaps injetados (/sitemap640.xml e afins) apontando para páginas de
    # spam em japonês, tudo indexado no Google. 410 Gone diz "isto não existe
    # mais e não volte a perguntar" — o Google desindexa em semanas, contra
    # meses de recrawl de um 404.
    location ~ ^/sitemap\d+\.xml$ { return 410; }
    # A superfície do WordPress também não existe mais aqui.
    location ~ ^/(wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php) { return 410; }

    # ── Redirects das URLs antigas já indexadas ─────────────────────────────
    # (/estado → /checklist existe no vercel.json e NÃO foi copiado de propósito:
    # /checklist é a página interna de acompanhamento do projeto, que vive em
    # public/aprovacao/ e nem versionada é. No domínio do cliente aquele 301
    # apontaria para uma rota inexistente — pior que o 404 honesto.)
    location = /timetable             { return 301 /contato; }
    location = /feed                  { return 301 /; }
    location = /comments/feed         { return 301 /; }

    location = /publicacoes           { return 301 /doutorado; }
    location = /en/publicacoes        { return 301 /en/doutorado; }
    location = /es/publicacoes        { return 301 /es/doutorado; }

    location = /midia                 { return 301 /eventos; }
    location = /en/midia              { return 301 /en/eventos; }
    location = /es/midia              { return 301 /es/eventos; }

    # A árvore antiga era /especialidades/<slug>; hoje é /especialidade/<slug>
    # (singular) e três slugs mudaram de nome junto.
    location = /especialidades/aneurisma                         { return 301 /especialidade/aneurisma-cerebral; }
    location = /especialidades/malformacoes-arteriovenosas-mavs  { return 301 /especialidade/mavs; }
    location = /especialidades/moya-moya                         { return 301 /especialidade/doenca-de-moyamoya; }
    location = /especialidades/neuralgia-do-trigemio             { return 301 /especialidade/neuralgia-do-trigemeo; }
    location = /especialidades/cavernomas                        { return 301 /especialidade/cavernomas; }
    location = /especialidades/espasmo-hemifacial                { return 301 /especialidade/espasmo-hemifacial; }
    location = /especialidades/schwannoma-vestibular             { return 301 /especialidade/schwannoma-vestibular; }
    location = /especialidades/tumores-cerebrais                 { return 301 /especialidade/tumores-cerebrais; }
    location = /especialidades/tumores-hipofisarios              { return 301 /especialidade/tumores-hipofisarios; }
    location = /especialidades/tumores-medulares                 { return 301 /especialidade/tumores-medulares; }

    location ~ ^/portfolio(/.*)?$     { return 301 /; }
    location = /wp-sitemap.xml        { return 301 /sitemap.xml; }
    location ~ ^/wp-sitemap-          { return 301 /sitemap.xml; }

    # ── Cache ───────────────────────────────────────────────────────────────
    # `expires` e `add_header Cache-Control` juntos emitem DOIS cache-control na
    # mesma resposta (um de cada), e quem está no meio do caminho escolhe qual
    # obedecer. Só o add_header, então.
    #
    # /assets tem hash no nome: pode ser imutável por um ano.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # /hero não tem hash (é referenciado pelo preload no index.html): 7 dias.
    location /hero/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    # O service worker é vazio de propósito, mas um sw.js em cache é um sw.js
    # que você não consegue mais substituir.
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── Rotas ───────────────────────────────────────────────────────────────
    # Cada rota tem seu PRÓPRIO index.html prerenderizado (dist/<rota>/index.html).
    # A ordem importa: $uri/index.html antes do /index.html final, senão toda
    # rota cairia no HTML da home e o site inteiro serviria a mesma página —
    # respondendo 200, o que nenhum teste de link quebrado pegaria.
    location / {
        # O HTML não pode ficar em cache: é ele que carrega o texto clínico
        # atualizado, e é onde entram os hashes novos dos assets a cada deploy.
        # A regra por extensão (`~* \.html$`) não servia: a URL pedida é `/` ou
        # `/sobre-mim`, sem extensão — o arquivo é que é index.html. Resultado:
        # a resposta saía SEM cache-control nenhum, e cada browser inventava por
        # quanto tempo guardar uma página que precisa mudar no dia da publicação.
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/index.html @notfound;
    }

    # Endereço que não existe responde 404 servindo a página de NotFound já
    # renderizada. O fallback ingênuo (`/index.html` no fim do try_files) servia
    # a HOME com status 200 para qualquer URL — soft 404: o Google mantém a URL
    # indexada como duplicata da home em vez de removê-la. Isso pesa mais aqui
    # do que num site comum, porque o domínio precisa desindexar os milhares de
    # endereços de spam que o WordPress invadido publicou.
    location @notfound {
        return 404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
